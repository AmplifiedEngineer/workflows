name: release-manual

on:
  workflow_call:
    inputs:
      files:
        description: JSON files with a top-level version, one workspace-relative path per line.
        type: string
        required: true
      bump:
        description: Version bump, auto, patch, minor or major.
        type: string
        default: auto
      dry-run:
        description: Report what would change without writing.
        type: boolean
        default: false
    secrets:
      app-client-id:
        description: Client ID of the GitHub App that opens the release pull request.
        required: false
      app-private-key:
        description: Private key of the GitHub App that opens the release pull request.
        required: false
    outputs:
      version:
        description: The version without a leading v.
        value: ${{ jobs.release.outputs.version }}
      tag:
        description: The tag, the version with a leading v.
        value: ${{ jobs.release.outputs.tag }}
      released:
        description: Whether this run created the tag or the release.
        value: ${{ jobs.release.outputs.released }}

permissions: {}

jobs:
  prepare:
    name: prepare
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Check the App secrets
        if: ${{ !inputs.dry-run }}
        env:
          APP_CLIENT_ID: ${{ secrets.app-client-id }}
          APP_PRIVATE_KEY: ${{ secrets.app-private-key }}
        run: |
          if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
            echo "::error::release-manual needs the app-client-id and app-private-key secrets"
            exit 1
          fi

      - name: Create the App token
        id: app
        if: ${{ !inputs.dry-run }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.app-client-id }}
          private-key: ${{ secrets.app-private-key }}
          permission-contents: write
          permission-pull-requests: write

      - name: Prepare the release pull request
        uses: $/ci/release-action
        with:
          mode: prepare
          files: ${{ inputs.files }}
          bump: ${{ inputs.bump }}
          dry-run: ${{ inputs.dry-run }}
          token: ${{ steps.app.outputs.token || github.token }}

  release:
    name: release
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # tags and creates the release
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      released: ${{ steps.release.outputs.released }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Release
        id: release
        uses: $/ci/release-action
        with:
          mode: release
          files: ${{ inputs.files }}
